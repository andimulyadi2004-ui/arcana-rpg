name: Build and attach add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin zip

      - name: Build packs
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate
        run: python3 tools/validate.py

      - name: Package source
        run: |
          zip -qr dist/arcana-rpg-source.zip art src tools README.md build.sh

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          # create the release if it does not exist yet
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Arcana RPG v1.0.0" \
              --notes "Minecraft Bedrock 1.26.40 add-on: 30 items, 18 blocks, 2 armour sets, 35 recipes."
          gh release upload "$TAG" \
            dist/ArcanaRPG.mcaddon \
            dist/ArcanaRPG_BP.mcpack \
            dist/ArcanaRPG_RP.mcpack \
            dist/arcana-rpg-source.zip \
            --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcana-rpg-packs
          path: dist/*
